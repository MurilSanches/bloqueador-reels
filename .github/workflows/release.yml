name: Release

# Cada push na main (que mexa no app) testa, gera o AAB assinado, cria um GitHub Release
# e, se a Play estiver configurada, envia para a faixa escolhida.
# Detalhes e configuração: playstore/PUBLICACAO-AUTOMATICA.md

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'playstore/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'SEGURANCA.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSAO_BASE: "0.1"        # major.minor; o patch é o número da execução (0.1.1, 0.1.2, ...)
  OFFSET_VERSION_CODE: 10   # versionCode = offset + nº da execução (o 1º envio manual da Play usa 1)
  PACOTE: com.murilo.bloqueadorreels

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Instala o SDK do Android e aceita as licenças (o Gradle baixa o que faltar).
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão desta publicação
        id: v
        run: |
          echo "code=$((OFFSET_VERSION_CODE + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=${VERSAO_BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Falhou aqui, nada é publicado.
      - name: Testes unitários e lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Chave de assinatura (dos Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltam Secrets de assinatura (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Veja playstore/PUBLICACAO-AUTOMATICA.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Gerar o AAB assinado
        run: >
          ./gradlew --no-daemon bundleRelease
          -PversionCode=${{ steps.v.outputs.code }}
          -PversionName=${{ steps.v.outputs.name }}

      - name: Conferir assinatura e preparar o arquivo
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
          cp app/build/outputs/bundle/release/app-release.aab "bloqueador-reels-v${{ steps.v.outputs.name }}.aab"
          ls -la bloqueador-reels-v*.aab

      - name: Apagar a chave do disco do runner
        if: always()
        run: rm -f release.keystore keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: aab-${{ steps.v.outputs.name }}
          path: bloqueador-reels-v*.aab
          retention-days: 30

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.name }}" "bloqueador-reels-v${{ steps.v.outputs.name }}.aab" \
            --title "v${{ steps.v.outputs.name }}" --generate-notes --target "$GITHUB_SHA"

      - name: Google Play configurada?
        id: play
        env:
          JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON não configurado: o AAB ficou só no GitHub Release."
          fi

      # Faixa: variável PLAY_TRACK (internal, alpha = teste fechado, beta, production). Padrão: internal.
      # Status: variável PLAY_STATUS (completed ou draft). Padrão: completed.
      - name: Enviar para a Google Play
        if: steps.play.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACOTE }}
          releaseFiles: bloqueador-reels-v${{ steps.v.outputs.name }}.aab
          releaseName: v${{ steps.v.outputs.name }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
